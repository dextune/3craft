name: Bug report
description: Report a reproducible 3Craft defect.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for security vulnerabilities. Follow the private reporting procedure in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Briefly explain what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and errors
      description: Attach only logs from which private images, secrets, and absolute home paths have been removed.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Ubuntu 24.04, Python 3.12.3, Node 24, browser/version"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Image intake / sufficiency
        - Relief / voxel / palette
        - Schematic / BOM
        - API / jobs / storage
        - Web / Three.js viewer
        - CLI / local launcher
        - Documentation / setup
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I reproduced this on the latest default branch.
          required: true
        - label: I removed sensitive information and private files.
          required: true
