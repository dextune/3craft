name: Bug report
description: 재현 가능한 3Craft 결함을 보고합니다.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        보안 취약점은 이 양식을 사용하지 말고 SECURITY.md의 private reporting 절차를 따라주세요.
  - type: textarea
    id: summary
    attributes:
      label: 문제 요약
      description: 무엇이 잘못되었는지 간결하게 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 단계
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작과 오류
      description: 개인 이미지, secret, absolute home path를 제거한 log만 첨부해 주세요.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 환경
      placeholder: "Ubuntu 24.04, Python 3.12.3, Node 24, browser/version"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      options:
        - Image intake / sufficiency
        - Relief / voxel / palette
        - Schematic / BOM
        - API / jobs / storage
        - Web / Three.js viewer
        - CLI / local launcher
        - Documentation / setup
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 확인
      options:
        - label: 최신 default branch에서 재현했습니다.
          required: true
        - label: 민감정보와 개인 파일을 제거했습니다.
          required: true
