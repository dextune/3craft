name: Feature request
description: 3Craft 기능 또는 개발 경험 개선을 제안합니다.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: 구현 상태와 roadmap을 먼저 확인해 주세요. 실제 AI reconstruction과 production infrastructure는 아직 backlog입니다.
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 구현 방식보다 사용자 또는 개발자의 문제를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 예상 입력·출력과 사용자 흐름을 포함해 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
  - type: dropdown
    id: scope
    attributes:
      label: 예상 범위
      options:
        - Local MVP improvement
        - Reconstruction / geometry research
        - Minecraft export compatibility
        - Production backend / security
        - Frontend / viewer / accessibility
        - Documentation / developer experience
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 결정성·보안·개인정보·호환성 영향
