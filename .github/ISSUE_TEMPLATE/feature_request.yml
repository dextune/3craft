name: Feature request
description: Propose an improvement to 3Craft features or developer experience.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Review the implementation status and roadmap first. Real AI reconstruction and production infrastructure remain backlog items.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user or developer problem rather than only an implementation approach.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Include expected inputs, outputs, and user flow.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Expected scope
      options:
        - Local MVP improvement
        - Reconstruction / geometry research
        - Minecraft export compatibility
        - Production backend / security
        - Frontend / viewer / accessibility
        - Documentation / developer experience
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Determinism, security, privacy, and compatibility effects
